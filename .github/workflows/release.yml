name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  release-matrix:
    name: Release ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # build and publish in parallel: linux/386, linux/amd64, linux/arm64, windows/386, windows/amd64, darwin/amd64, darwin/arm64
        goos: [linux, windows, darwin]
        goarch: ["386", amd64, arm64]
        exclude:
          - goarch: "386"
            goos: darwin
          - goarch: arm64
            goos: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          ext=""
          if [ "${GOOS}" = "windows" ]; then
            ext=".exe"
          fi

          name="closed-source-solution-${TAG}-${GOOS}-${GOARCH}"
          mkdir -p "dist/${name}"

          go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" \
            -o "dist/${name}/closed-source-solution-compile${ext}" ./compile
          go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" \
            -o "dist/${name}/closed-source-solution-remote${ext}" ./remote

          cp LICENSE README.md "dist/${name}/"

          if [ "${GOOS}" = "windows" ]; then
            (cd dist && zip -r "${name}.zip" "${name}")
          else
            (cd dist && tar -czf "${name}.tar.gz" "${name}")
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/closed-source-solution-*
